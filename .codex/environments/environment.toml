version = 1
name = "HackerAI Server"

[setup]
script = '''
set -e

# Codex runs this in the new worktree. Keep dependency links local to it.
if [ -n "${CODEX_WORKTREE_PATH:-}" ]; then
  cd "$CODEX_WORKTREE_PATH"
fi

# Noninteractive shells on the Mac mini may not load nvm automatically.
if ! command -v corepack >/dev/null 2>&1; then
  export NVM_DIR="${NVM_DIR:-$HOME/.nvm}"
  if [ -s "$NVM_DIR/nvm.sh" ]; then
    . "$NVM_DIR/nvm.sh"
  fi
fi

corepack pnpm install --frozen-lockfile
corepack pnpm run check:local-dependencies
'''
