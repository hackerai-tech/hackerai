AWSTemplateFormatVersion: "2010-09-09"
Description: HackerAI Lambda MicroVM image build and runtime prerequisites

Parameters:
  GitHubRepository:
    Type: String
    Default: hackerai-tech/hackerai
    Description: GitHub owner/repository allowed to publish MicroVM images
  GitHubEnvironment:
    Type: String
    Default: aws-lambda-microvm-production
    Description: Protected GitHub environment allowed to publish MicroVM images
  ExistingGitHubOidcProviderArn:
    Type: String
    Default: ""
    Description: Existing account-wide GitHub OIDC provider ARN; leave empty only in the primary stack
Conditions:
  CreateGitHubOidcProvider: !Equals [!Ref ExistingGitHubOidcProviderArn, ""]
Resources:
  EgressVpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.90.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: !Sub "hackerai-microvm-egress-${AWS::Region}"
        - Key: application
          Value: hackerai

  EgressInternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub "hackerai-microvm-egress-${AWS::Region}"
        - Key: application
          Value: hackerai

  EgressInternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      InternetGatewayId: !Ref EgressInternetGateway
      VpcId: !Ref EgressVpc

  EgressPublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      # Deliberately one AZ per region for the initial fixed-egress rollout.
      # A second NAT would double the regional fixed cost and publish another
      # customer allowlist IP; see the README availability tradeoff.
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: 10.90.0.0/24
      MapPublicIpOnLaunch: false
      VpcId: !Ref EgressVpc
      Tags:
        - Key: Name
          Value: !Sub "hackerai-microvm-egress-public-${AWS::Region}"
        - Key: application
          Value: hackerai

  EgressPublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref EgressVpc
      Tags:
        - Key: Name
          Value: !Sub "hackerai-microvm-egress-public-${AWS::Region}"
        - Key: application
          Value: hackerai

  EgressPublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: EgressInternetGatewayAttachment
    Properties:
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref EgressInternetGateway
      RouteTableId: !Ref EgressPublicRouteTable

  EgressPublicRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref EgressPublicRouteTable
      SubnetId: !Ref EgressPublicSubnet

  EgressElasticIp:
    Type: AWS::EC2::EIP
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    DependsOn: EgressInternetGatewayAttachment
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub "hackerai-microvm-egress-${AWS::Region}"
        - Key: application
          Value: hackerai

  EgressNatGateway:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt EgressElasticIp.AllocationId
      ConnectivityType: public
      SubnetId: !Ref EgressPublicSubnet
      Tags:
        - Key: Name
          Value: !Sub "hackerai-microvm-egress-${AWS::Region}"
        - Key: application
          Value: hackerai

  EgressPrivateSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: 10.90.1.0/24
      MapPublicIpOnLaunch: false
      VpcId: !Ref EgressVpc
      Tags:
        - Key: Name
          Value: !Sub "hackerai-microvm-egress-private-${AWS::Region}"
        - Key: application
          Value: hackerai

  EgressPrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref EgressVpc
      Tags:
        - Key: Name
          Value: !Sub "hackerai-microvm-egress-private-${AWS::Region}"
        - Key: application
          Value: hackerai

  EgressPrivateDefaultRoute:
    Type: AWS::EC2::Route
    Properties:
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref EgressNatGateway
      RouteTableId: !Ref EgressPrivateRouteTable

  EgressPrivateRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref EgressPrivateRouteTable
      SubnetId: !Ref EgressPrivateSubnet

  EgressSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow Lambda MicroVM outbound traffic through the regional NAT gateway
      SecurityGroupEgress:
        - CidrIp: 0.0.0.0/0
          Description: HackerAI Cloud Agent internet egress
          IpProtocol: "-1"
      VpcId: !Ref EgressVpc
      Tags:
        - Key: Name
          Value: !Sub "hackerai-microvm-egress-${AWS::Region}"
        - Key: application
          Value: hackerai

  NetworkConnectorOperatorRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/AWSLambdaNetworkConnectorOperatorPolicy"

  EgressNetworkConnector:
    Type: AWS::Lambda::NetworkConnector
    Properties:
      Name: hackerai-microvm-static-egress
      OperatorRole: !GetAtt NetworkConnectorOperatorRole.Arn
      Configuration:
        VpcEgressConfiguration:
          AssociatedComputeResourceTypes:
            - MicroVm
          NetworkProtocol: IPv4
          SecurityGroupIds:
            - !Ref EgressSecurityGroup
          SubnetIds:
            - !Ref EgressPrivateSubnet
      Tags:
        - Key: application
          Value: hackerai
        - Key: component
          Value: cloud-sandbox

  ArtifactBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  MicrovmBuildRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action:
              - sts:AssumeRole
              - sts:TagSession
      Policies:
        - PolicyName: ReadArtifactsAndWriteBuildLogs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "${ArtifactBucket.Arn}/*"
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: "*"

  MicrovmRuntimePolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: Run and manage HackerAI Lambda MicroVM sessions
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - lambda:RunMicrovm
              - lambda:CreateMicrovmAuthToken
              - lambda:GetMicrovm
              - lambda:ListMicrovms
              - lambda:ResumeMicrovm
              - lambda:SuspendMicrovm
              - lambda:TerminateMicrovm
            Resource: "*"
          - Effect: Allow
            Action: lambda:PassNetworkConnector
            # AWS does not currently support resource-level permissions for
            # PassNetworkConnector. Keep the wildcard isolated to this one
            # permission-only action.
            Resource: "*"
          - Effect: Allow
            Action: iam:PassRole
            Resource: !GetAtt MicrovmExecutionRole.Arn

  MicrovmExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action:
              - sts:AssumeRole
              - sts:TagSession
      Policies:
        - PolicyName: WriteRuntimeLogs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: logs:CreateLogGroup
                Resource: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/microvms/hackerai-cloud-agent"
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/microvms/hackerai-cloud-agent:log-stream:*"

  MicrovmDeployerPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: Build and publish HackerAI Lambda MicroVM images
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - s3:PutObject
              - s3:GetObject
            Resource: !Sub "${ArtifactBucket.Arn}/*"
          - Effect: Allow
            Action:
              - lambda:CreateMicrovmImage
              - lambda:UpdateMicrovmImage
              - lambda:GetMicrovmImage
              - lambda:GetMicrovmImageVersion
              - lambda:ListMicrovmImages
              - lambda:ListMicrovmImageVersions
              - lambda:ListMicrovmImageBuilds
              - lambda:ListManagedMicrovmImages
              - lambda:ListManagedMicrovmImageVersions
              - lambda:TagResource
              - lambda:UntagResource
            Resource: "*"
          - Effect: Allow
            Action: lambda:PassNetworkConnector
            # AWS does not currently support resource-level permissions for
            # PassNetworkConnector. Keep the wildcard isolated to this one
            # permission-only action.
            Resource: "*"
          - Effect: Allow
            Action: iam:PassRole
            Resource: !GetAtt MicrovmBuildRole.Arn

  GitHubActionsOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateGitHubOidcProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      Tags:
        - Key: application
          Value: hackerai

  GitHubMicrovmReleaseRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Publish and smoke-test HackerAI Lambda MicroVM images from GitHub Actions
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - CreateGitHubOidcProvider
                - !Ref GitHubActionsOidcProvider
                - !Ref ExistingGitHubOidcProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                "token.actions.githubusercontent.com:aud": sts.amazonaws.com
                "token.actions.githubusercontent.com:sub": !Sub "repo:${GitHubRepository}:environment:${GitHubEnvironment}"
      ManagedPolicyArns:
        - !Ref MicrovmDeployerPolicy
        - !Ref MicrovmRuntimePolicy

Outputs:
  EgressIpv4Address:
    Description: Stable public IPv4 address used by HackerAI MicroVM outbound traffic
    Value: !Ref EgressElasticIp
  EgressNetworkConnectorArn:
    Description: Regional VPC egress connector passed to Lambda MicroVM launches
    Value: !Ref EgressNetworkConnector
  ArtifactBucketName:
    Value: !Ref ArtifactBucket
  BuildRoleArn:
    Value: !GetAtt MicrovmBuildRole.Arn
  RuntimePolicyArn:
    Value: !Ref MicrovmRuntimePolicy
  ExecutionRoleArn:
    Value: !GetAtt MicrovmExecutionRole.Arn
  DeployerPolicyArn:
    Value: !Ref MicrovmDeployerPolicy
  GitHubReleaseRoleArn:
    Value: !GetAtt GitHubMicrovmReleaseRole.Arn
  GitHubOidcProviderArn:
    Value: !If
      - CreateGitHubOidcProvider
      - !Ref GitHubActionsOidcProvider
      - !Ref ExistingGitHubOidcProviderArn
