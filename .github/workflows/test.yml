name: Run Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.4
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test pip bootstrap integrity
        run: python3 -B -m unittest discover -s docker -p 'test_pip_bootstrap.py' -v

      - name: Test sandbox decoder package integrity
        run: python3 -B -m unittest discover -s docker -p 'test_brotli.py' -v

      - name: Type check
        run: pnpm typecheck

      - name: Test Linux AppImage child library isolation
        run: |
          rustc --edition 2021 --test packages/desktop/src-tauri/src/child_environment.rs -o "$RUNNER_TEMP/appimage-child-environment-tests"
          "$RUNNER_TEMP/appimage-child-environment-tests"

      - name: Verify usage and Cloud recovery transactions against Redis
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y redis-server
          node scripts/verify-paid-usage-ledger.mjs
          node scripts/verify-cloud-recovery-admission.mjs
          pnpm exec jest --runInBand --testMatch "**/cloud-workspace-identity.integration.ts"

      - name: Verify skills and tooling
        run: pnpm skills:sync:strix:check && pnpm test:tooling

      - name: Discover complete Jest inventory
        run: |
          mkdir -p coverage
          pnpm exec jest --listTests --json > coverage/expected-tests.json

      - name: Upload test inventory
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jest-inventory
          path: coverage/expected-tests.json
          if-no-files-found: error
          retention-days: 3

  jest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.4
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Jest shard with coverage
        run: >-
          pnpm exec jest --ci --coverage --maxWorkers=2
          --shard=${{ matrix.shard }}/2 --coverageThreshold='{}'
          --coverageReporters=json --coverageDirectory=coverage/shard
          --json --outputFile=coverage/shard/results.json

      - name: Upload shard coverage and results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jest-shard-${{ matrix.shard }}
          path: coverage/shard/
          if-no-files-found: error
          retention-days: 3

  test:
    name: test (22.23.4)
    if: ${{ always() }}
    needs: [verify, jest]
    runs-on: ubuntu-latest
    steps:
      - name: Require every prerequisite
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
          JEST_RESULT: ${{ needs.jest.result }}
        run: |
          test "$VERIFY_RESULT" = success
          test "$JEST_RESULT" = success

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.4
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download test inventory
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: jest-inventory
          path: coverage

      - name: Download both Jest shards
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: jest-shard-*
          path: coverage

      - name: Verify inventory and combined coverage
        run: node scripts/testing/merge-coverage.mjs

      - name: Upload combined coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jest-coverage
          path: coverage/combined/
          if-no-files-found: error
          retention-days: 3
