name: Run Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Only superseded PR validation is cancelled; every main/scheduled run is kept.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Plan CI
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      jest: ${{ steps.plan.outputs.jest }}
      typecheck: ${{ steps.plan.outputs.typecheck }}
      lint: ${{ steps.plan.outputs.lint }}
      tooling: ${{ steps.plan.outputs.tooling }}
      tooling_suites: ${{ steps.plan.outputs.tooling_suites }}
      integrations: ${{ steps.plan.outputs.integrations }}
      security: ${{ steps.plan.outputs.security }}
      languages: ${{ steps.plan.outputs.languages }}
      coverage: ${{ steps.plan.outputs.coverage }}
      shards: ${{ steps.plan.outputs.shards }}
      shard_count: ${{ steps.plan.outputs.shard_count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify planning and failure propagation
        run: node --test scripts/testing/ci.test.mjs
      - name: Select affected checks
        id: plan
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/testing/ci.mjs plan

  lint:
    name: ESLint
    needs: changes
    if: needs.changes.outputs.lint == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-ci-deps
      - name: Lint relevant source without autofix
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/testing/lint-ci.mjs

  typecheck:
    name: Typecheck and skill integrity
    needs: changes
    if: needs.changes.outputs.typecheck == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci-deps
      - run: pnpm typecheck
      - run: pnpm skills:sync:strix:check

  jest:
    name: Jest (${{ matrix.shard }}/${{ needs.changes.outputs.shard_count }})
    needs: changes
    if: needs.changes.outputs.jest != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.changes.outputs.shards) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-ci-deps
      - name: Run selected tests
        env:
          CI_JEST_MODE: ${{ needs.changes.outputs.jest }}
          CI_SHARD: ${{ matrix.shard }}/${{ needs.changes.outputs.shard_count }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_COVERAGE: ${{ needs.changes.outputs.coverage }}
        run: node scripts/testing/ci.mjs jest

  tooling:
    name: Node tooling
    needs: changes
    if: needs.changes.outputs.tooling == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci-deps
      - name: Run selected tooling suites
        env:
          CI_TOOLING_SUITES: ${{ needs.changes.outputs.tooling_suites }}
        run: node scripts/testing/ci.mjs tooling

  integrations:
    name: Linux safety integrations
    needs: changes
    if: needs.changes.outputs.integrations == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci-deps
      - name: Test pip bootstrap integrity
        run: python3 -B -m unittest discover -s docker -p 'test_pip_bootstrap.py' -v

      - name: Test sandbox decoder package integrity
        run: python3 -B -m unittest discover -s docker -p 'test_brotli.py' -v

      - name: Test sandbox scanner archive integrity
        run: python3 -B -m unittest discover -s docker -p 'test_trivy.py' -v

      - name: Verify native Linux scanner release and offline finding
        run: |
          sudo sh docker/install_trivy.sh
          fixture=$(mktemp -d)
          trap 'rm -rf "$fixture"' EXIT
          printf 'FROM alpine:3.20\nUSER root\n' > "$fixture/Dockerfile"
          sudo unshare --net /usr/local/bin/trivy config --skip-check-update --disable-telemetry --skip-version-check --format json --output "$fixture/result.json" "$fixture"
          python3 - "$fixture/result.json" <<'PYTHON'
          import json, sys
          with open(sys.argv[1]) as report:
              data = json.load(report)
          findings = [item["ID"] for result in data.get("Results", [])
                      for item in result.get("Misconfigurations", [])]
          assert "DS-0002" in findings, findings
          print("Verified scanner detects root-user fixture without network access")
          PYTHON

      - name: Verify build compiler isolation and failure gate
        run: node --test scripts/build.test.mjs

      - name: Test Linux AppImage child library isolation
        run: |
          rustc --edition 2021 --test packages/desktop/src-tauri/src/child_environment.rs -o "$RUNNER_TEMP/appimage-child-environment-tests"
          "$RUNNER_TEMP/appimage-child-environment-tests"

      - name: Verify usage and Cloud recovery transactions against Redis
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y redis-server
          node scripts/verify-paid-usage-ledger.mjs
          node scripts/verify-cloud-recovery-admission.mjs
          pnpm exec jest --runInBand --testMatch "**/cloud-workspace-identity.integration.ts"

  codeql:
    name: CodeQL (${{ matrix.language }})
    needs: changes
    if: needs.changes.outputs.security == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(needs.changes.outputs.languages) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.language == 'go' && 'autobuild' || 'none' }}
      - uses: github/codeql-action/autobuild@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        if: matrix.language == 'go'
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          category: /language:${{ matrix.language }}
          output: codeql-results
          # During migration, default setup stays active while this replacement
          # is verified. Remove the temporary repository variable after handoff.
          upload: ${{ vars.HACKERAI_CODEQL_UPLOAD == 'false' && 'never' || 'always' }}
      - name: Preserve security analysis evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: codeql-${{ matrix.language }}
          path: codeql-results/*.sarif
          if-no-files-found: error
          retention-days: 7

  ci:
    name: CI
    needs: [changes, lint, typecheck, jest, tooling, integrations, codeql]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require every planned result
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: node scripts/testing/ci.mjs gate
