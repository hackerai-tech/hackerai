name: Release AWS Lambda MicroVM image

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/aws-lambda-microvm-release.yml"
      # Only this binary is packaged from aws-lambda-microvm/. Documentation
      # and CloudFormation edits must not republish unchanged regional images.
      - "aws-lambda-microvm/naabu"
      - "docker/**"
      - "packages/local/**"
      - "scripts/build-aws-microvm-release-manifest.ts"
      - "scripts/deploy-aws-microvm.mjs"
      - "scripts/package-aws-microvm.mjs"
      - "scripts/lib/aws-microvm-build-diagnostics.cjs"
      - "scripts/lib/aws-microvm-container-image.cjs"
      - "scripts/smoke-aws-microvm.mjs"
      - "scripts/sync-trigger-microvm-release-env.ts"
      - "scripts/lib/aws-microvm-release-manifest.ts"
      - "scripts/lib/trigger-microvm-release-env.ts"
      - "lib/ai/tools/utils/aws-lambda-microvm-release.ts"
      - "lib/ai/tools/utils/aws-lambda-microvm-workspace.ts"
      - "lib/ai/tools/utils/aws-lambda-microvm.ts"
      - "lib/ai/tools/utils/cloud-sandbox.ts"
      - "lib/ai/tools/utils/cloud-scan-safety.ts"
      - "convex/s3Actions.ts"
      - "convex/s3Utils.ts"
      - "package.json"
      - "pnpm-lock.yaml"
  workflow_dispatch:
    inputs:
      rebuild_base:
        description: "Rebuild the Kali/tool base even when docker/ is unchanged"
        required: false
        default: false
        type: boolean

concurrency:
  group: aws-lambda-microvm-production
  cancel-in-progress: false

jobs:
  base:
    name: Resolve immutable sandbox base
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.resolve.outputs.image }}
      reused: ${{ steps.inspect.outputs.exists }}
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository_owner }}/hackerai-sandbox
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Calculate base image tag
        id: context
        shell: bash
        run: |
          tree_id="$(git rev-parse HEAD:docker)"
          echo "tree_id=${tree_id}" >> "$GITHUB_OUTPUT"
          echo "tag=microvm-base-${tree_id}" >> "$GITHUB_OUTPUT"
      - name: Reuse existing content-addressed base
        id: inspect
        env:
          BASE_TAG: ${{ steps.context.outputs.tag }}
          EXPECTED_TREE_ID: ${{ steps.context.outputs.tree_id }}
          FORCE_REBUILD: ${{ github.event_name == 'workflow_dispatch' && inputs.rebuild_base }}
        shell: bash
        run: |
          if [[ "$FORCE_REBUILD" == "true" ]]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          image_ref="${REGISTRY}/${IMAGE_NAME}:${BASE_TAG}"
          inspect_file="${RUNNER_TEMP}/microvm-base-inspect.txt"
          if docker buildx imagetools inspect "$image_ref" > "$inspect_file" 2>/dev/null; then
            digest="$(awk '$1 == "Digest:" { print $2; exit }' "$inspect_file")"
            if [[ ! "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
              echo "Unable to resolve an immutable digest for $image_ref"
              exit 1
            fi
            image_json="$(docker buildx imagetools inspect "$image_ref" --format '{{json .Image}}')"
            architecture="$(jq -r 'if .architecture then .architecture else .["linux/arm64"].architecture // empty end' <<< "$image_json")"
            os="$(jq -r 'if .os then .os else .["linux/arm64"].os // empty end' <<< "$image_json")"
            tree_id="$(jq -r 'if .config then .config.Labels["tech.hackerai.microvm-base-tree"] // empty else .["linux/arm64"].config.Labels["tech.hackerai.microvm-base-tree"] // empty end' <<< "$image_json")"
            if [[ "$os/$architecture" != "linux/arm64" || "$tree_id" != "$EXPECTED_TREE_ID" ]]; then
              echo "Refusing incompatible base tag: expected linux/arm64 tree $EXPECTED_TREE_ID, got $os/$architecture tree ${tree_id:-missing}"
              exit 1
            fi
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "digest=$digest" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build and publish changed sandbox base
        id: build
        if: steps.inspect.outputs.exists != 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./docker
          file: ./docker/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.context.outputs.tag }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            tech.hackerai.microvm-base-tree=${{ steps.context.outputs.tree_id }}
          cache-from: type=gha,scope=microvm-sandbox-base
          cache-to: type=gha,mode=max,scope=microvm-sandbox-base
          no-cache: ${{ github.event_name == 'workflow_dispatch' && inputs.rebuild_base }}
          platforms: linux/arm64
      - name: Resolve exact base image digest
        id: resolve
        env:
          EXISTING_DIGEST: ${{ steps.inspect.outputs.digest }}
          BUILT_DIGEST: ${{ steps.build.outputs.digest }}
          EXPECTED_TREE_ID: ${{ steps.context.outputs.tree_id }}
        shell: bash
        run: |
          digest="${EXISTING_DIGEST:-$BUILT_DIGEST}"
          if [[ ! "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "Missing valid sandbox base digest"
            exit 1
          fi
          image_ref="${REGISTRY}/${IMAGE_NAME}@${digest}"
          image_json="$(docker buildx imagetools inspect "$image_ref" --format '{{json .Image}}')"
          architecture="$(jq -r 'if .architecture then .architecture else .["linux/arm64"].architecture // empty end' <<< "$image_json")"
          os="$(jq -r 'if .os then .os else .["linux/arm64"].os // empty end' <<< "$image_json")"
          tree_id="$(jq -r 'if .config then .config.Labels["tech.hackerai.microvm-base-tree"] // empty else .["linux/arm64"].config.Labels["tech.hackerai.microvm-base-tree"] // empty end' <<< "$image_json")"
          if [[ "$os/$architecture" != "linux/arm64" || "$tree_id" != "$EXPECTED_TREE_ID" ]]; then
            echo "Resolved base image does not match linux/arm64 tree $EXPECTED_TREE_ID"
            exit 1
          fi
          docker logout "$REGISTRY" >/dev/null 2>&1 || true
          if ! docker buildx imagetools inspect "$image_ref" >/dev/null; then
            echo "Sandbox base image must allow anonymous GHCR pulls"
            exit 1
          fi
          echo "image=${image_ref}" >> "$GITHUB_OUTPUT"
          echo "Using ${image_ref}"

  prepare:
    name: Build release artifact
    needs: base
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: aws-lambda-microvm-production
    permissions:
      contents: read
    env:
      CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
      AWS_LAMBDA_MICROVM_CONTAINER_BASE_IMAGE: ${{ needs.base.outputs.image }}
    steps:
      - name: Validate shared release configuration
        shell: bash
        run: |
          if [[ -z "$CONVEX_DEPLOY_KEY" ]]; then
            echo "Missing GitHub environment secret: CONVEX_DEPLOY_KEY"
            exit 1
          fi
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20.x
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Type check release sources
        run: pnpm typecheck
      - name: Deploy production Convex backend
        run: pnpm exec convex deploy --message "AWS Lambda MicroVM release ${GITHUB_SHA}"
      - name: Build image artifact once
        run: pnpm aws:microvm:package
      - name: Upload image artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aws-lambda-microvm-image
          path: .artifacts/aws-lambda-microvm/hackerai-lambda-microvm.zip
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish and smoke-test ${{ matrix.region }}
    needs: prepare
    runs-on: ubuntu-latest
    # Allow a bounded wait for a prior AWS build lock plus two bounded publish
    # windows when an opaque image-builder failure needs one retry.
    timeout-minutes: 150
    environment: aws-lambda-microvm-production
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - region: us-east-1
            variable_suffix: US_EAST_1
          - region: us-west-2
            variable_suffix: US_WEST_2
          - region: eu-west-1
            variable_suffix: EU_WEST_1
    env:
      AWS_REGION: ${{ matrix.region }}
      # Environment-scoped vars are unavailable while GitHub expands a job matrix.
      # Resolve them only after this job has entered the protected environment.
      AWS_LAMBDA_MICROVM_ARTIFACT_BUCKET: ${{ vars[format('AWS_LAMBDA_MICROVM_ARTIFACT_BUCKET_{0}', matrix.variable_suffix)] }}
      AWS_LAMBDA_MICROVM_BUILD_ROLE_ARN: ${{ vars[format('AWS_LAMBDA_MICROVM_BUILD_ROLE_ARN_{0}', matrix.variable_suffix)] }}
      AWS_LAMBDA_MICROVM_EXECUTION_ROLE_ARN: ${{ vars[format('AWS_LAMBDA_MICROVM_EXECUTION_ROLE_ARN_{0}', matrix.variable_suffix)] }}
      AWS_LAMBDA_MICROVM_EGRESS_CONNECTOR_ARN: ${{ vars[format('AWS_LAMBDA_MICROVM_EGRESS_CONNECTOR_ARN_{0}', matrix.variable_suffix)] }}
      AWS_LAMBDA_MICROVM_EGRESS_IPV4: ${{ vars[format('AWS_LAMBDA_MICROVM_EGRESS_IPV4_{0}', matrix.variable_suffix)] }}
      AWS_RELEASE_ROLE_ARN: ${{ vars[format('AWS_RELEASE_ROLE_ARN_{0}', matrix.variable_suffix)] }}
    steps:
      - name: Validate regional release configuration
        shell: bash
        run: |
          required=(AWS_LAMBDA_MICROVM_ARTIFACT_BUCKET AWS_LAMBDA_MICROVM_BUILD_ROLE_ARN AWS_LAMBDA_MICROVM_EXECUTION_ROLE_ARN AWS_LAMBDA_MICROVM_EGRESS_CONNECTOR_ARN AWS_LAMBDA_MICROVM_EGRESS_IPV4 AWS_RELEASE_ROLE_ARN)
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing GitHub environment variable for $AWS_REGION: $name"
              exit 1
            fi
          done
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20.x
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Download image artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: aws-lambda-microvm-image
          path: .artifacts/aws-lambda-microvm
      - name: Authenticate to regional AWS release role
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-region: ${{ matrix.region }}
          role-to-assume: ${{ env.AWS_RELEASE_ROLE_ARN }}
          role-session-name: hackerai-microvm-${{ github.run_id }}-${{ strategy.job-index }}
      - name: Publish exact regional image version
        id: publish_attempt_1
        env:
          AWS_LAMBDA_MICROVM_OUTPUT_FILE: ${{ runner.temp }}/${{ matrix.region }}.env
          AWS_LAMBDA_MICROVM_PUBLISH_ATTEMPTS: "1"
          AWS_LAMBDA_MICROVM_RETRY_SIGNAL_FILE: ${{ runner.temp }}/${{ matrix.region }}.retry
        shell: bash
        run: |
          set +e
          node scripts/deploy-aws-microvm.mjs
          status=$?
          set -e
          if [[ -f "$AWS_LAMBDA_MICROVM_RETRY_SIGNAL_FILE" ]]; then
            echo "retry=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          exit "$status"
      - name: Refresh AWS credentials for regional image retry
        if: steps.publish_attempt_1.outputs.retry == 'true'
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-region: ${{ matrix.region }}
          role-to-assume: ${{ env.AWS_RELEASE_ROLE_ARN }}
          role-session-name: hackerai-microvm-${{ github.run_id }}-${{ strategy.job-index }}-retry
          unset-current-credentials: true
      - name: Retry exact regional image version
        if: steps.publish_attempt_1.outputs.retry == 'true'
        env:
          AWS_LAMBDA_MICROVM_OUTPUT_FILE: ${{ runner.temp }}/${{ matrix.region }}.env
          AWS_LAMBDA_MICROVM_PUBLISH_ATTEMPTS: "1"
        run: node scripts/deploy-aws-microvm.mjs
      - name: Launch and terminate exact regional image version
        env:
          AWS_LAMBDA_MICROVM_OUTPUT_FILE: ${{ runner.temp }}/${{ matrix.region }}.env
        shell: bash
        run: |
          # shellcheck disable=SC2163 # Export the variable named by each verified release-output key.
          while IFS='=' read -r name value; do
            case "$name" in
              AWS_LAMBDA_MICROVM_IMAGE_ID|AWS_LAMBDA_MICROVM_IMAGE_VERSION|AWS_LAMBDA_MICROVM_EGRESS_CONNECTOR_ARN|AWS_LAMBDA_MICROVM_EGRESS_IPV4)
                printf -v "$name" '%s' "$value"
                export "$name"
                printf '%s=%s\n' "$name" "$value" >> "$GITHUB_ENV"
                ;;
            esac
          done < "$AWS_LAMBDA_MICROVM_OUTPUT_FILE"
          pnpm aws:microvm:smoke
      - name: Upload verified regional release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aws-lambda-microvm-release-${{ matrix.region }}
          path: ${{ runner.temp }}/${{ matrix.region }}.env
          if-no-files-found: error
          retention-days: 7

  promote:
    name: Atomically promote regional release
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: aws-lambda-microvm-production
    permissions:
      contents: read
    env:
      TRIGGER_PROJECT_ID: ${{ vars.TRIGGER_PROJECT_ID }}
      TRIGGER_ACCESS_TOKEN: ${{ secrets.TRIGGER_ACCESS_TOKEN }}
      AWS_LAMBDA_MICROVM_ENABLED_REGIONS: ${{ vars.AWS_LAMBDA_MICROVM_ENABLED_REGIONS || 'us-east-1,us-west-2,eu-west-1' }}
    steps:
      - name: Validate promotion configuration
        shell: bash
        run: |
          if [[ -z "$TRIGGER_PROJECT_ID" || -z "$TRIGGER_ACCESS_TOKEN" ]]; then
            echo "Missing TRIGGER_PROJECT_ID or TRIGGER_ACCESS_TOKEN"
            exit 1
          fi
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20.x
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Download every verified regional release
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: aws-lambda-microvm-release-*
          path: ${{ runner.temp }}/regional-releases
          merge-multiple: true
      - name: Build atomic release manifest
        env:
          AWS_LAMBDA_MICROVM_RELEASE_INPUT_DIR: ${{ runner.temp }}/regional-releases
          AWS_LAMBDA_MICROVM_OUTPUT_FILE: ${{ runner.temp }}/microvm-release.env
        shell: bash
        run: |
          pnpm aws:microvm:build-release-manifest
          while IFS='=' read -r name value; do
            case "$name" in
              AWS_LAMBDA_MICROVM_RELEASE_MANIFEST|AWS_LAMBDA_MICROVM_IMAGE_ID|AWS_LAMBDA_MICROVM_IMAGE_VERSION|AWS_LAMBDA_MICROVM_EXECUTION_ROLE_ARN)
                printf '%s=%s\n' "$name" "$value" >> "$GITHUB_ENV"
                ;;
            esac
          done < "$AWS_LAMBDA_MICROVM_OUTPUT_FILE"
      - name: Sync and verify Trigger.dev production environment
        run: pnpm aws:microvm:sync-trigger-env
      - name: Deploy pinned Trigger.dev worker
        run: pnpm exec trigger deploy --env prod --skip-update-check
      - name: Write release summary
        shell: bash
        run: |
          {
            echo "### AWS Lambda MicroVM regional release promoted"
            echo
            echo "- Release: \`$GITHUB_SHA\`"
            echo "- Regions: \`us-east-1\`, \`us-west-2\`, \`eu-west-1\`"
            echo "- All regional images: built, validated, smoke-tested through their reserved egress IPv4, and terminated"
            echo "- Trigger.dev production: stored manifest verified and worker deployed"
            echo "- Vercel: unchanged (Agent execution is Trigger.dev-only)"
          } >> "$GITHUB_STEP_SUMMARY"
