name: Roll out Trigger cloud sandbox provider

on:
  workflow_dispatch:
    inputs:
      provider:
        description: Production cloud sandbox provider
        required: true
        default: e2b
        type: choice
        options:
          - e2b
          - aws-lambda-microvm

permissions:
  contents: read

jobs:
  rollout:
    name: Roll out ${{ inputs.provider }} to Trigger Production
    runs-on: ubuntu-latest
    environment: aws-lambda-microvm-production
    env:
      CLOUD_SANDBOX_PROVIDER: ${{ inputs.provider }}
      TRIGGER_PROJECT_ID: ${{ vars.TRIGGER_PROJECT_ID }}
      TRIGGER_ACCESS_TOKEN: ${{ secrets.TRIGGER_ACCESS_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20.x
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Set and verify Trigger Production provider
        run: pnpm trigger:set-cloud-sandbox-provider
      - name: Deploy Trigger Production worker
        run: pnpm exec trigger deploy --env prod --skip-update-check
      - name: Summarize rollout
        shell: bash
        run: |
          {
            echo "### Trigger Production sandbox provider rollout"
            echo
            echo "- Project: \`$TRIGGER_PROJECT_ID\`"
            echo "- Environment: \`prod\`"
            echo "- Provider: \`$CLOUD_SANDBOX_PROVIDER\`"
            echo "- Stored value: verified before worker deployment"
          } >> "$GITHUB_STEP_SUMMARY"
