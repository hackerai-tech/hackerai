name: Desktop Native Tests

on:
  pull_request:
    paths:
      - "packages/desktop/src-tauri/**"
      - ".github/workflows/desktop-native-tests.yml"
  push:
    branches: [main]
    paths:
      - "packages/desktop/src-tauri/**"
      - ".github/workflows/desktop-native-tests.yml"

permissions:
  contents: read

jobs:
  linux-native-tests:
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: stable
          cache: false
      - uses: swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
        with:
          workspaces: packages/desktop/src-tauri -> target
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Test Linux native cancellation and command handling
        working-directory: packages/desktop/src-tauri
        run: cargo test --locked --lib
