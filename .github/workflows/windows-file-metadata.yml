name: Windows file metadata

on:
  push:
    branches: [main]
    paths:
      - "lib/ai/tools/utils/sandbox-file-uploader.ts"
      - "lib/ai/tools/utils/centrifugo-sandbox.ts"
      - "lib/ai/tools/utils/__tests__/sandbox-file-uploader*.test.ts"
      - "packages/local/src/utils.ts"
      - ".github/workflows/windows-file-metadata.yml"
      - "pnpm-lock.yaml"
      - "jest.config.js"
      - "jest.setup.js"
  pull_request:
    branches: [main]
    paths:
      - "lib/ai/tools/utils/sandbox-file-uploader.ts"
      - "lib/ai/tools/utils/centrifugo-sandbox.ts"
      - "lib/ai/tools/utils/__tests__/sandbox-file-uploader*.test.ts"
      - "packages/local/src/utils.ts"
      - ".github/workflows/windows-file-metadata.yml"
      - "pnpm-lock.yaml"
      - "jest.config.js"
      - "jest.setup.js"

jobs:
  windows-file-metadata:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.4
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify real Windows file metadata commands
        run: pnpm exec jest lib/ai/tools/utils/__tests__/sandbox-file-uploader.windows.test.ts --runInBand --ci
